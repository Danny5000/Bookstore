x-publication-settings: &publication-settings
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
  UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-536870912}
  INGEST_MAX_EXPANDED_BYTES: ${INGEST_MAX_EXPANDED_BYTES:-2147483648}
  INGEST_MAX_ENTRIES: ${INGEST_MAX_ENTRIES:-10000}
  INGEST_MAX_XML_BYTES: ${INGEST_MAX_XML_BYTES:-8388608}
  INGEST_MAX_IMAGE_PIXELS: ${INGEST_MAX_IMAGE_PIXELS:-100000000}
  INGEST_MAX_COMPRESSION_RATIO: ${INGEST_MAX_COMPRESSION_RATIO:-200}
  INGEST_TIMEOUT_MS: ${INGEST_TIMEOUT_MS:-900000}
  STRIPE_ENABLED: "false"
  STRIPE_TEST_FIXTURE_MODE: "false"
  STRIPE_LIVE_MODE: "false"
  STRIPE_AUTOMATIC_TAX_ENABLED: ${STRIPE_AUTOMATIC_TAX_ENABLED:-false}
  STRIPE_TAX_CODE_PROSE: ${STRIPE_TAX_CODE_PROSE:-}
  STRIPE_TAX_CODE_COMIC: ${STRIPE_TAX_CODE_COMIC:-}
  STRIPE_CHECKOUT_DURATION_SECONDS: ${STRIPE_CHECKOUT_DURATION_SECONDS:-1800}
  STRIPE_WEBHOOK_TOLERANCE_SECONDS: ${STRIPE_WEBHOOK_TOLERANCE_SECONDS:-300}
  COMMERCE_CHECKOUT_RATE_LIMIT_WINDOW_SECONDS: ${COMMERCE_CHECKOUT_RATE_LIMIT_WINDOW_SECONDS:-60}
  COMMERCE_CHECKOUT_RATE_LIMIT_MAX: ${COMMERCE_CHECKOUT_RATE_LIMIT_MAX:-5}

services:
  app:
    image: ${APP_IMAGE:?APP_IMAGE must be an immutable versioned image}
    init: true
    environment:
      <<: *publication-settings
      NODE_ENV: production
      APP_ENV: production
      APPLICATION_MODE: maintenance
      ORIGIN: ${ORIGIN:?ORIGIN must be set}
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: ${DATABASE_NAME:?DATABASE_NAME must be set}
      DATABASE_USER: ${DATABASE_USER:?DATABASE_USER must be set}
      DATABASE_PASSWORD_FILE: /run/secrets/database_password
      DATABASE_POOL_MAX: "5"
      DATABASE_CONNECTION_TIMEOUT_MS: "5000"
      DATABASE_STATEMENT_TIMEOUT_MS: "30000"
      DATABASE_READINESS_TIMEOUT_MS: "2000"
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      STORAGE_STAGING_ROOT: /var/lib/pale-orbit/staging
      STORAGE_PUBLICATION_ROOT: /var/lib/pale-orbit/publication
      STORAGE_COVERS_ROOT: /var/lib/pale-orbit/covers
      STORAGE_SCRATCH_ROOT: /tmp/pale-orbit-verified
      STORAGE_STAGING_RETENTION_HOURS: ${STORAGE_STAGING_RETENTION_HOURS:-24}
      STORAGE_ORPHAN_RETENTION_HOURS: ${STORAGE_ORPHAN_RETENTION_HOURS:-168}
      AUTH_SECRET_FILE: /run/secrets/auth_secret
      AUTH_SESSION_EXPIRES_SECONDS: ${AUTH_SESSION_EXPIRES_SECONDS:-604800}
      AUTH_VERIFICATION_EXPIRES_SECONDS: ${AUTH_VERIFICATION_EXPIRES_SECONDS:-3600}
      AUTH_RESET_EXPIRES_SECONDS: ${AUTH_RESET_EXPIRES_SECONDS:-3600}
      AUTH_MAGIC_EXPIRES_SECONDS: ${AUTH_MAGIC_EXPIRES_SECONDS:-900}
      AUTH_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:-60}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-100}
      AUTH_LOGIN_RATE_LIMIT_MAX: ${AUTH_LOGIN_RATE_LIMIT_MAX:-5}
      AUTH_EMAIL_RATE_LIMIT_MAX: ${AUTH_EMAIL_RATE_LIMIT_MAX:-3}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST must be set}
      SMTP_PORT: ${SMTP_PORT:?SMTP_PORT must be set}
      SMTP_SECURE: ${SMTP_SECURE:?SMTP_SECURE must be set}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:?SMTP_REQUIRE_TLS must be set}
      SMTP_FROM: ${SMTP_FROM:?SMTP_FROM must be set}
      SMTP_CONNECTION_TIMEOUT_MS: ${SMTP_CONNECTION_TIMEOUT_MS:-5000}
      SMTP_GREETING_TIMEOUT_MS: ${SMTP_GREETING_TIMEOUT_MS:-5000}
      SMTP_SOCKET_TIMEOUT_MS: ${SMTP_SOCKET_TIMEOUT_MS:-10000}
      JOB_POLL_INTERVAL_MS: "1000"
      JOB_LEASE_MS: "30000"
      JOB_RETRY_BASE_MS: "1000"
      JOB_RETRY_MAX_MS: "300000"
      WORKER_READY_FILE: /tmp/worker-ready
      HOST: 0.0.0.0
      PORT: "3000"
      ADDRESS_HEADER: X-Forwarded-For
      XFF_DEPTH: "1"
    secrets:
      - database_password
      - auth_secret
    volumes:
      - book_staging:/var/lib/pale-orbit/staging
      - book_publication:/var/lib/pale-orbit/publication:ro
      - book_covers:/var/lib/pale-orbit/covers
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    restart: unless-stopped
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/health/ready').then((response)=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: ${WEB_CPU_LIMIT:-1.00}
          memory: ${WEB_MEMORY_LIMIT:-768M}

  worker:
    image: ${APP_IMAGE:?APP_IMAGE must be an immutable versioned image}
    init: true
    command: [node, build/services/worker.js]
    environment:
      <<: *publication-settings
      NODE_ENV: production
      APP_ENV: production
      APPLICATION_MODE: maintenance
      ORIGIN: ${ORIGIN:?ORIGIN must be set}
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: ${DATABASE_NAME:?DATABASE_NAME must be set}
      DATABASE_WORKER_USER: ${DATABASE_WORKER_USER:?DATABASE_WORKER_USER must be set}
      DATABASE_WORKER_PASSWORD_FILE: /run/secrets/database_worker_password
      DATABASE_POOL_MAX: "5"
      DATABASE_CONNECTION_TIMEOUT_MS: "5000"
      DATABASE_STATEMENT_TIMEOUT_MS: "30000"
      DATABASE_READINESS_TIMEOUT_MS: "2000"
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      STORAGE_STAGING_ROOT: /var/lib/pale-orbit/staging
      STORAGE_PUBLICATION_ROOT: /var/lib/pale-orbit/publication
      STORAGE_COVERS_ROOT: /var/lib/pale-orbit/covers
      STORAGE_SCRATCH_ROOT: /tmp/pale-orbit-verified
      STORAGE_STAGING_RETENTION_HOURS: ${STORAGE_STAGING_RETENTION_HOURS:-24}
      STORAGE_ORPHAN_RETENTION_HOURS: ${STORAGE_ORPHAN_RETENTION_HOURS:-168}
      AUTH_SECRET_FILE: /run/secrets/auth_secret
      AUTH_SESSION_EXPIRES_SECONDS: ${AUTH_SESSION_EXPIRES_SECONDS:-604800}
      AUTH_VERIFICATION_EXPIRES_SECONDS: ${AUTH_VERIFICATION_EXPIRES_SECONDS:-3600}
      AUTH_RESET_EXPIRES_SECONDS: ${AUTH_RESET_EXPIRES_SECONDS:-3600}
      AUTH_MAGIC_EXPIRES_SECONDS: ${AUTH_MAGIC_EXPIRES_SECONDS:-900}
      AUTH_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:-60}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-100}
      AUTH_LOGIN_RATE_LIMIT_MAX: ${AUTH_LOGIN_RATE_LIMIT_MAX:-5}
      AUTH_EMAIL_RATE_LIMIT_MAX: ${AUTH_EMAIL_RATE_LIMIT_MAX:-3}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST must be set}
      SMTP_PORT: ${SMTP_PORT:?SMTP_PORT must be set}
      SMTP_SECURE: ${SMTP_SECURE:?SMTP_SECURE must be set}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:?SMTP_REQUIRE_TLS must be set}
      SMTP_USER: ${SMTP_USER:?SMTP_USER must be set}
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      SMTP_FROM: ${SMTP_FROM:?SMTP_FROM must be set}
      SMTP_CONNECTION_TIMEOUT_MS: ${SMTP_CONNECTION_TIMEOUT_MS:-5000}
      SMTP_GREETING_TIMEOUT_MS: ${SMTP_GREETING_TIMEOUT_MS:-5000}
      SMTP_SOCKET_TIMEOUT_MS: ${SMTP_SOCKET_TIMEOUT_MS:-10000}
      JOB_POLL_INTERVAL_MS: "1000"
      JOB_LEASE_MS: "30000"
      JOB_RETRY_BASE_MS: "1000"
      JOB_RETRY_MAX_MS: "300000"
      WORKER_READY_FILE: /tmp/worker-ready
    secrets:
      - database_worker_password
      - auth_secret
      - smtp_password
    volumes:
      - book_staging:/var/lib/pale-orbit/staging
      - book_publication:/var/lib/pale-orbit/publication
      - book_covers:/var/lib/pale-orbit/covers
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [CMD, node, -e, "require('node:fs').statSync('/tmp/worker-ready').size > 0 || process.exit(1)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: ${WORKER_CPU_LIMIT:-0.75}
          memory: ${WORKER_MEMORY_LIMIT:-512M}

  migrate:
    profiles: [tools]
    image: ${APP_IMAGE:?APP_IMAGE must be an immutable versioned image}
    command: [node, build/services/migrate.js]
    environment:
      NODE_ENV: production
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: ${DATABASE_NAME:?DATABASE_NAME must be set}
      DATABASE_OWNER_USER: ${DATABASE_OWNER_USER:?DATABASE_OWNER_USER must be set}
      DATABASE_OWNER_PASSWORD_FILE: /run/secrets/database_owner_password
      DATABASE_MIGRATION_WEB_USER: ${DATABASE_USER:?DATABASE_USER must be set}
      DATABASE_MIGRATION_WORKER_USER: ${DATABASE_WORKER_USER:?DATABASE_WORKER_USER must be set}
      DATABASE_MIGRATION_STORAGE_CLEANUP_USER: ${DATABASE_STORAGE_CLEANUP_USER:?DATABASE_STORAGE_CLEANUP_USER must be set}
      DATABASE_POOL_MAX: "1"
      DATABASE_CONNECTION_TIMEOUT_MS: "5000"
      DATABASE_STATEMENT_TIMEOUT_MS: "30000"
      DATABASE_READINESS_TIMEOUT_MS: "2000"
    secrets:
      - database_owner_password
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    restart: "no"

  database-role-provision:
    profiles: [tools]
    image: ${APP_IMAGE:?APP_IMAGE must be an immutable versioned image}
    command: [node, build/services/provision-database-roles.js]
    environment:
      NODE_ENV: production
      APP_ENV: production
      APPLICATION_MODE: maintenance
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: ${DATABASE_NAME:?DATABASE_NAME must be set}
      DATABASE_OWNER_USER: ${DATABASE_OWNER_USER:?DATABASE_OWNER_USER must be set}
      DATABASE_OWNER_PASSWORD_FILE: /run/secrets/database_owner_password
      DATABASE_USER: ${DATABASE_USER:?DATABASE_USER must be set}
      DATABASE_PASSWORD_FILE: /run/secrets/database_password
      DATABASE_STORAGE_CLEANUP_USER: ${DATABASE_STORAGE_CLEANUP_USER:?DATABASE_STORAGE_CLEANUP_USER must be set}
      DATABASE_STORAGE_CLEANUP_PASSWORD_FILE: /run/secrets/database_storage_cleanup_password
      DATABASE_WORKER_USER: ${DATABASE_WORKER_USER:?DATABASE_WORKER_USER must be set}
      DATABASE_WORKER_PASSWORD_FILE: /run/secrets/database_worker_password
      DATABASE_CONNECTION_TIMEOUT_MS: "5000"
      DATABASE_STATEMENT_TIMEOUT_MS: "30000"
    secrets:
      - database_owner_password
      - database_password
      - database_storage_cleanup_password
      - database_worker_password
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    restart: "no"

  bootstrap-admin:
    profiles: [tools]
    image: ${APP_IMAGE:?APP_IMAGE must be an immutable versioned image}
    command: [node, build/services/bootstrap-admin.js]
    environment:
      NODE_ENV: production
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: ${DATABASE_NAME:?DATABASE_NAME must be set}
      DATABASE_USER: ${DATABASE_USER:?DATABASE_USER must be set}
      DATABASE_PASSWORD_FILE: /run/secrets/database_password
      DATABASE_POOL_MAX: "1"
      DATABASE_CONNECTION_TIMEOUT_MS: "5000"
      DATABASE_STATEMENT_TIMEOUT_MS: "30000"
      DATABASE_READINESS_TIMEOUT_MS: "2000"
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?BOOTSTRAP_ADMIN_EMAIL must be set}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:?BOOTSTRAP_ADMIN_NAME must be set}
      BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/bootstrap_admin_password
    secrets:
      - database_password
      - bootstrap_admin_password
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    restart: "no"

  storage-cleanup:
    profiles: [tools]
    image: ${APP_IMAGE:?APP_IMAGE must be an immutable versioned image}
    command: [node, build/services/cleanup-storage.js]
    environment:
      NODE_ENV: production
      APP_ENV: production
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: ${DATABASE_NAME:?DATABASE_NAME must be set}
      DATABASE_STORAGE_CLEANUP_USER: ${DATABASE_STORAGE_CLEANUP_USER:?DATABASE_STORAGE_CLEANUP_USER must be set}
      DATABASE_STORAGE_CLEANUP_PASSWORD_FILE: /run/secrets/database_storage_cleanup_password
      DATABASE_POOL_MAX: "1"
      DATABASE_CONNECTION_TIMEOUT_MS: "5000"
      DATABASE_STATEMENT_TIMEOUT_MS: "30000"
      DATABASE_READINESS_TIMEOUT_MS: "2000"
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      STORAGE_STAGING_ROOT: /var/lib/pale-orbit/staging
      STORAGE_PUBLICATION_ROOT: /var/lib/pale-orbit/publication
      STORAGE_COVERS_ROOT: /var/lib/pale-orbit/covers
      STORAGE_SCRATCH_ROOT: /tmp/pale-orbit-verified
      STORAGE_STAGING_RETENTION_HOURS: ${STORAGE_STAGING_RETENTION_HOURS:-24}
      STORAGE_ORPHAN_RETENTION_HOURS: ${STORAGE_ORPHAN_RETENTION_HOURS:-168}
    secrets:
      - database_storage_cleanup_password
    volumes:
      - book_staging:/var/lib/pale-orbit/staging
      - book_publication:/var/lib/pale-orbit/publication
      - book_covers:/var/lib/pale-orbit/covers
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    restart: "no"

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18.4-alpine3.24}
    environment:
      POSTGRES_DB: ${DATABASE_NAME:?DATABASE_NAME must be set}
      POSTGRES_USER: ${DATABASE_OWNER_USER:?DATABASE_OWNER_USER must be set}
      POSTGRES_PASSWORD_FILE: /run/secrets/database_owner_password
    secrets:
      - database_owner_password
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    stop_grace_period: 60s
    shm_size: 128mb
    deploy:
      resources:
        limits:
          cpus: ${POSTGRES_CPU_LIMIT:-1.50}
          memory: ${POSTGRES_MEMORY_LIMIT:-1G}

  caddy:
    image: caddy:2.11.4-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS must be set}
    ports:
      - ${HTTP_BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80
      - ${HTTPS_BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443
      - ${HTTPS_BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443/udp
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'wget -q --spider http://127.0.0.1:2015/health/caddy']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: ${CADDY_CPU_LIMIT:-0.50}
          memory: ${CADDY_MEMORY_LIMIT:-256M}

secrets:
  database_owner_password:
    environment: DATABASE_OWNER_PASSWORD
  database_password:
    environment: DATABASE_PASSWORD
  database_worker_password:
    environment: DATABASE_WORKER_PASSWORD
  database_storage_cleanup_password:
    environment: DATABASE_STORAGE_CLEANUP_PASSWORD
  auth_secret:
    environment: AUTH_SECRET
  smtp_password:
    environment: SMTP_PASSWORD
  bootstrap_admin_password:
    environment: BOOTSTRAP_ADMIN_PASSWORD

networks:
  default:
    internal: ${COMPOSE_DEFAULT_NETWORK_INTERNAL:-false}

volumes:
  postgres_data:
  book_staging:
  book_publication:
  book_covers:
  caddy_data:
  caddy_config:
