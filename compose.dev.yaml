services:
  app:
    build:
      context: .
      target: development
    init: true
    command: [npm, run, dev, --, --host, 0.0.0.0, --port, "5173"]
    env_file:
      - ${DEV_ENV_FILE:-.env}
    environment:
      DATABASE_HOST: postgres
      SMTP_HOST: mailpit
      STORAGE_LOCAL_ROOT: /var/lib/pale-orbit/storage
      WORKER_READY_FILE: /tmp/worker-ready
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - ./.data/storage:/var/lib/pale-orbit/storage
    ports:
      - 127.0.0.1:${DEV_APP_PORT:-5173}:5173
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:5173/health/ready').then((response)=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    stop_grace_period: 15s

  worker:
    build:
      context: .
      target: development
    init: true
    command: [npm, run, worker:watch]
    env_file:
      - ${DEV_ENV_FILE:-.env}
    environment:
      DATABASE_HOST: postgres
      SMTP_HOST: mailpit
      STORAGE_LOCAL_ROOT: /var/lib/pale-orbit/storage
      WORKER_READY_FILE: /tmp/worker-ready
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - ./.data/storage:/var/lib/pale-orbit/storage
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "require('node:fs').statSync('/tmp/worker-ready').size > 0 || process.exit(1)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    stop_grace_period: 30s

  migrate:
    profiles: [tools]
    build:
      context: .
      target: development
    command: [npm, run, db:migrate:raw]
    env_file:
      - ${DEV_ENV_FILE:-.env}
    environment:
      DATABASE_HOST: postgres
      SMTP_HOST: mailpit
      WORKER_READY_FILE: /tmp/worker-ready
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  bootstrap-admin:
    profiles: [tools]
    build:
      context: .
      target: development
    command: [npm, run, admin:bootstrap:raw]
    env_file:
      - ${DEV_ENV_FILE:-.env}
    environment:
      DATABASE_HOST: postgres
      SMTP_HOST: mailpit
      WORKER_READY_FILE: /tmp/worker-ready
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  storage-cleanup:
    profiles: [tools]
    build:
      context: .
      target: development
    command: [npm, run, storage:cleanup:raw]
    env_file:
      - ${DEV_ENV_FILE:-.env}
    environment:
      DATABASE_HOST: postgres
      STORAGE_LOCAL_ROOT: /var/lib/pale-orbit/storage
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - ./.data/storage:/var/lib/pale-orbit/storage
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:18.4-alpine3.24
    environment:
      POSTGRES_DB: ${DATABASE_NAME:?DATABASE_NAME must be set}
      POSTGRES_USER: ${DATABASE_USER:?DATABASE_USER must be set}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set}
    volumes:
      - postgres_dev_data:/var/lib/postgresql
    ports:
      - 127.0.0.1:${DEV_DATABASE_PORT:-5432}:5432
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    stop_grace_period: 30s

  mailpit:
    image: axllent/mailpit:v1.30.0
    command: [--max, "500", --max-age, 7d, --disable-version-check]
    ports:
      - 127.0.0.1:${DEV_SMTP_PORT:-1025}:1025
      - 127.0.0.1:${DEV_MAILPIT_HTTP_PORT:-8025}:8025
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    stop_grace_period: 10s

volumes:
  app_node_modules:
  postgres_dev_data:
